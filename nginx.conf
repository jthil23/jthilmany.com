# conf.d files are included inside nginx's http context.
# Only successful, fingerprinted Astro assets receive an immutable policy.
map "$status:$uri" $site_cache_control {
    default "no-cache";
    "~^200:/_astro/[^/]+\\.[A-Za-z0-9_-]{8,}\\.(css|js|mjs|png|jpg|jpeg|gif|webp|avif|svg|ico|woff|woff2|ttf|otf|wasm)$" "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header Cache-Control $site_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    location = /404.html {
        internal;
    }
}
